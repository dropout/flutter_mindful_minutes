name: flutter_mindful_minutes_example
description: "Demonstrates how to use the flutter_mindful_minutes plugin."
publish_to: 'none'

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_mindful_minutes:
    # When depending on this package from a real application you should use:
    #   flutter_mindful_minutes: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
